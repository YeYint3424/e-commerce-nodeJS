<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product Details - Shoply</title>
<script>
(function () {
  var stored = localStorage.getItem('theme');
  var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (stored === 'dark' || (!stored && prefersDark)) {
    document.documentElement.classList.add('dark');
  }
})();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
        },
        colors: {
          gold: {
            50: '#fdf8ec',
            100: '#faedc4',
            200: '#f5db8c',
            300: '#edc35a',
            400: '#e0a83e',
            500: '#cc8f2e',
            600: '#b8860b',
            700: '#966b0a',
            800: '#78560c',
            900: '#63470f',
            950: '#392808',
          },
        },
      },
    },
  };
</script>
<link rel="stylesheet" href="/css/animations.css" />
<link rel="stylesheet" href="/css/main.css" />
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased dark:bg-black dark:text-neutral-100">
<div id="site-header"></div>
<main class="mx-auto max-w-6xl px-4 py-10 sm:px-6 lg:px-8">
  <div id="product-detail-content" class="grid gap-10 lg:grid-cols-2">
    <div id="detail-gallery" class="anim-fade-up"></div>
    <div class="anim-fade-up flex flex-col gap-4">
      <span id="detail-category" class="text-xs font-semibold uppercase tracking-wide text-gold-500 dark:text-gold-400"></span>
      <h1 id="detail-name" class="text-3xl font-bold text-slate-900 dark:text-white"></h1>
      <div class="flex items-baseline gap-3">
        <span id="detail-price" class="text-3xl font-bold text-slate-900 dark:text-white"></span>
        <span id="detail-original-price" class="hidden text-lg text-slate-400 line-through"></span>
      </div>
      <span id="detail-stock" class="text-sm font-semibold"></span>
      <p id="detail-description" class="text-sm leading-relaxed text-slate-600 dark:text-neutral-300"></p>

      <div>
        <p class="mb-2 text-sm font-semibold text-slate-700 dark:text-neutral-300">Payment options</p>
        <div id="payment-options-list" class="flex flex-wrap gap-2"></div>
      </div>

      <div class="flex items-center gap-3">
        <span class="text-sm font-semibold text-slate-700 dark:text-neutral-300">Quantity</span>
        <div class="flex items-center gap-2">
          <button type="button" id="qty-decrease" class="h-9 w-9 rounded-full border border-slate-200 text-slate-600 hover:border-gold-300 hover:text-gold-600 disabled:opacity-40 dark:border-neutral-700">-</button>
          <span id="qty-value" class="w-8 text-center text-sm font-semibold">1</span>
          <button type="button" id="qty-increase" class="h-9 w-9 rounded-full border border-slate-200 text-slate-600 hover:border-gold-300 hover:text-gold-600 disabled:opacity-40 dark:border-neutral-700">+</button>
        </div>
      </div>

      <div class="mt-2 flex gap-3">
        <button type="button" id="add-to-cart" class="flex-1 rounded-xl bg-gold-600 py-3 text-sm font-semibold text-white transition-colors hover:bg-gold-500 disabled:cursor-not-allowed disabled:bg-slate-300 dark:disabled:bg-neutral-700">Add to Cart</button>
        <button type="button" id="buy-now" class="flex-1 rounded-xl border border-gold-600 py-3 text-sm font-semibold text-gold-600 transition-colors hover:bg-gold-50 disabled:cursor-not-allowed disabled:border-slate-300 disabled:text-slate-400 dark:hover:bg-gold-950">Buy Now</button>
      </div>
    </div>
  </div>
  <div id="product-not-found" class="hidden flex-col items-center gap-4 px-4 py-24 text-center">
    <i data-lucide="package-x" class="h-14 w-14 text-slate-300"></i>
    <h1 class="text-2xl font-bold text-slate-700 dark:text-neutral-200">Product not found</h1>
    <p class="text-sm text-slate-400">The product you're looking for doesn't exist or has been removed.</p>
    <a href="/products" class="rounded-full bg-gold-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-gold-500">Back to Products</a>
  </div>
</main>
<div id="site-footer"></div>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/js/customer/product-detail.js"></script>
</body>
</html>
