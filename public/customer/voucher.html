<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Voucher - Shoply</title>
<script>
(function () {
  var stored = localStorage.getItem('theme');
  var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (stored === 'dark' || (!stored && prefersDark)) {
    document.documentElement.classList.add('dark');
  }
})();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
        },
      },
    },
  };
</script>
<link rel="stylesheet" href="/css/animations.css" />
<link rel="stylesheet" href="/css/main.css" />
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
<div id="site-header"></div>
<main class="mx-auto max-w-3xl px-4 py-10 sm:px-6 lg:px-8">
  <a href="/voucher-list" class="inline-flex items-center gap-2 text-sm font-medium text-indigo-600 hover:text-indigo-500 dark:text-indigo-400"><i data-lucide="arrow-left" class="h-4 w-4"></i>Back to My Orders</a>

  <div id="voucher-skeleton" class="mt-6 animate-pulse space-y-4 rounded-2xl border border-slate-200 bg-white p-6 dark:border-slate-800 dark:bg-slate-900">
    <div class="h-6 w-40 rounded bg-slate-200 dark:bg-slate-800"></div>
    <div class="h-4 w-full rounded bg-slate-200 dark:bg-slate-800"></div>
    <div class="h-4 w-3/4 rounded bg-slate-200 dark:bg-slate-800"></div>
    <div class="h-24 w-full rounded bg-slate-200 dark:bg-slate-800"></div>
  </div>

  <div id="voucher-content" class="hidden mt-6 space-y-6">
    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
      <div class="flex flex-wrap items-start justify-between gap-4">
        <div class="flex items-center gap-3">
          <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-fuchsia-500 text-white"><i data-lucide="shopping-bag" class="h-6 w-6"></i></span>
          <div>
            <p class="text-lg font-bold text-slate-900 dark:text-white">Shoply</p>
            <p class="text-xs text-slate-400">Order Voucher</p>
          </div>
        </div>
        <div id="voucher-status-badge"></div>
      </div>

      <div class="mt-6 grid gap-2 text-sm sm:grid-cols-2">
        <p class="text-slate-500 dark:text-slate-400">Voucher ID: <span id="voucher-id" class="font-mono font-semibold text-slate-800 dark:text-slate-100"></span></p>
        <p class="text-slate-500 dark:text-slate-400">Order ID: <span id="voucher-order-id" class="font-mono font-semibold text-slate-800 dark:text-slate-100"></span></p>
        <p class="text-slate-500 dark:text-slate-400">Order Date: <span id="voucher-date" class="font-semibold text-slate-800 dark:text-slate-100"></span></p>
      </div>
    </div>

    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
      <h2 class="text-sm font-bold uppercase tracking-wide text-slate-400">Customer</h2>
      <div class="mt-3 grid gap-1 text-sm text-slate-700 dark:text-slate-200">
        <p><span class="text-slate-400">Name:</span> <span id="voucher-customer-name"></span></p>
        <p><span class="text-slate-400">Email:</span> <span id="voucher-customer-email"></span></p>
        <p><span class="text-slate-400">Phone:</span> <span id="voucher-customer-phone"></span></p>
        <p><span class="text-slate-400">Address:</span> <span id="voucher-customer-address"></span></p>
      </div>
    </div>

    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
      <h2 class="text-sm font-bold uppercase tracking-wide text-slate-400">Items</h2>
      <div id="voucher-items" class="mt-3 space-y-3"></div>
      <div class="mt-4 border-t border-slate-200 pt-4 text-sm dark:border-slate-800">
        <div class="flex justify-between text-slate-500 dark:text-slate-400"><span>Subtotal</span><span id="voucher-subtotal"></span></div>
        <div class="mt-1 flex justify-between text-base font-bold text-slate-900 dark:text-white"><span>Total</span><span id="voucher-total"></span></div>
      </div>
    </div>

    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
      <h2 class="text-sm font-bold uppercase tracking-wide text-slate-400">Payment Method</h2>
      <div id="voucher-payment" class="mt-3 text-sm text-slate-700 dark:text-slate-200"></div>
    </div>

    <div id="voucher-notes-section" class="hidden rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
      <h2 class="text-sm font-bold uppercase tracking-wide text-slate-400">Change Notes</h2>
      <ul id="voucher-notes" class="mt-3 space-y-2 text-sm text-slate-600 dark:text-slate-300"></ul>
    </div>

    <div class="flex flex-wrap items-center gap-3">
      <button type="button" id="voucher-download-btn" class="hidden inline-flex items-center gap-2 rounded-full bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-indigo-500">
        <i data-lucide="download" class="h-4 w-4"></i>Download Voucher (PDF)
      </button>
      <button type="button" id="voucher-cancel-btn" class="hidden inline-flex items-center gap-2 rounded-full border border-rose-200 px-5 py-2.5 text-sm font-semibold text-rose-600 transition-colors hover:bg-rose-50 dark:border-rose-800 dark:text-rose-300 dark:hover:bg-rose-950/40">
        <i data-lucide="x-circle" class="h-4 w-4"></i>Cancel Order
      </button>
    </div>
  </div>

  <div id="voucher-error" class="hidden flex-col items-center gap-4 rounded-2xl border border-dashed border-slate-300 py-20 text-center dark:border-slate-700">
    <i data-lucide="alert-circle" class="h-12 w-12 text-slate-300"></i>
    <p class="text-lg font-semibold text-slate-600 dark:text-slate-300">We could not load this voucher.</p>
    <a href="/voucher-list" class="rounded-full bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-indigo-500">Back to My Orders</a>
  </div>
</main>
<div id="site-footer"></div>
<script type="module" src="/js/customer/voucher.js"></script>
</body>
</html>
