<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Payment Failed - Shoply</title>
<script>
(function () {
  var stored = localStorage.getItem('theme');
  var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (stored === 'dark' || (!stored && prefersDark)) {
    document.documentElement.classList.add('dark');
  }
})();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
        },
        colors: {
          gold: {
            50: '#fdf8ec',
            100: '#faedc4',
            200: '#f5db8c',
            300: '#edc35a',
            400: '#e0a83e',
            500: '#cc8f2e',
            600: '#b8860b',
            700: '#966b0a',
            800: '#78560c',
            900: '#63470f',
            950: '#392808',
          },
        },
      },
    },
  };
</script>
<link rel="stylesheet" href="/css/animations.css" />
<link rel="stylesheet" href="/css/main.css" />
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased dark:bg-black dark:text-neutral-100">
<div id="site-header"></div>
<main class="mx-auto max-w-2xl px-4 py-10 sm:px-6 lg:px-8">
  <div class="flex flex-col items-center gap-4 rounded-2xl border border-rose-200 bg-rose-50 py-16 text-center dark:border-rose-800 dark:bg-rose-950/40">
    <i data-lucide="x-circle" class="h-12 w-12 text-rose-500"></i>
    <p class="text-lg font-semibold text-rose-800 dark:text-rose-200">Payment could not be completed</p>
    <p id="failed-reason" class="max-w-md text-sm text-rose-600 dark:text-rose-300"></p>
    <div class="flex flex-wrap items-center justify-center gap-3">
      <a id="retry-payment-link" href="#" class="hidden rounded-full bg-rose-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-rose-500">Retry Payment</a>
      <a href="/products" class="rounded-full border border-rose-300 px-5 py-2.5 text-sm font-semibold text-rose-700 hover:bg-rose-100 dark:border-rose-700 dark:text-rose-300 dark:hover:bg-rose-950">Continue Shopping</a>
    </div>
  </div>
</main>
<div id="site-footer"></div>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/js/customer/order-failed.js"></script>
</body>
</html>
