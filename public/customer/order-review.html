<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order Review - Shoply</title>
<script>
(function () {
  var stored = localStorage.getItem('theme');
  var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (stored === 'dark' || (!stored && prefersDark)) {
    document.documentElement.classList.add('dark');
  }
})();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
        },
      },
    },
  };
</script>
<link rel="stylesheet" href="/css/animations.css" />
<link rel="stylesheet" href="/css/main.css" />
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
<div id="site-header"></div>
<main class="mx-auto max-w-5xl px-4 py-10 sm:px-6 lg:px-8">
  <h1 class="anim-fade-up text-2xl font-bold text-slate-900 dark:text-white">Order Review</h1>

  <div id="review-empty" class="hidden mt-8 flex-col items-center gap-4 rounded-2xl border border-dashed border-slate-300 py-20 text-center dark:border-slate-700">
    <i data-lucide="shopping-cart" class="h-12 w-12 text-slate-300"></i>
    <p class="text-lg font-semibold text-slate-600 dark:text-slate-300">Your cart is empty</p>
    <a href="/products" class="rounded-full bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-indigo-500">Continue Shopping</a>
  </div>

  <div id="review-success" class="hidden mt-8 flex-col items-center gap-4 rounded-2xl border border-emerald-200 bg-emerald-50 py-16 text-center dark:border-emerald-800 dark:bg-emerald-950/40">
    <i data-lucide="check-circle" class="h-12 w-12 text-emerald-500"></i>
    <p class="text-lg font-semibold text-emerald-800 dark:text-emerald-200">Order placed successfully</p>
    <p id="success-order-id" class="text-sm text-emerald-700 dark:text-emerald-300"></p>
    <p class="max-w-md text-sm text-emerald-600 dark:text-emerald-300">Your order status is PENDING. Payment selection will be available in a later step.</p>
    <a href="/products" class="rounded-full bg-emerald-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-emerald-500">Continue Shopping</a>
  </div>

  <div id="review-content" class="mt-8 grid gap-8 lg:grid-cols-[1fr_360px]">
    <div class="space-y-8">
      <section>
        <h2 class="text-lg font-bold text-slate-900 dark:text-white">Items</h2>
        <div id="review-items" class="mt-4 space-y-4"></div>
      </section>

      <section>
        <h2 class="text-lg font-bold text-slate-900 dark:text-white">Shipping Information</h2>
        <form id="shipping-form" class="mt-4 space-y-4 rounded-2xl border border-slate-200 bg-white p-6 dark:border-slate-800 dark:bg-slate-900">
          <div>
            <label for="shipping-name" class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300">Full Name</label>
            <input id="shipping-name" type="text" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:focus:ring-indigo-900" />
            <p data-error-for="name" class="mt-1 text-xs text-rose-500"></p>
          </div>
          <div>
            <label for="shipping-phone" class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300">Phone</label>
            <input id="shipping-phone" type="tel" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:focus:ring-indigo-900" />
            <p data-error-for="phone" class="mt-1 text-xs text-rose-500"></p>
          </div>
          <div>
            <label for="shipping-address" class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300">Address</label>
            <input id="shipping-address" type="text" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:focus:ring-indigo-900" />
            <p data-error-for="address" class="mt-1 text-xs text-rose-500"></p>
          </div>
        </form>
      </section>
    </div>

    <aside class="h-fit rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
      <h2 class="text-lg font-bold text-slate-900 dark:text-white">Order Summary</h2>
      <div class="mt-4 space-y-2 text-sm">
        <div class="flex justify-between text-slate-500 dark:text-slate-400"><span>Items</span><span id="review-item-count">0</span></div>
        <div class="flex justify-between text-slate-600 dark:text-slate-300"><span>Subtotal</span><span id="review-subtotal">$0.00</span></div>
      </div>
      <div class="my-4 border-t border-slate-200 dark:border-slate-800"></div>
      <div class="flex justify-between text-base font-bold text-slate-900 dark:text-white"><span>Total</span><span id="review-total">$0.00</span></div>
      <button type="button" id="place-order-btn" class="mt-6 w-full rounded-xl bg-indigo-600 py-3 text-sm font-semibold text-white hover:bg-indigo-500 disabled:cursor-not-allowed disabled:opacity-60">Place Order</button>
      <a href="/cart" class="mt-4 inline-flex items-center gap-2 text-sm font-medium text-indigo-600 hover:text-indigo-500 dark:text-indigo-400"><i data-lucide="arrow-left" class="h-4 w-4"></i>Back to Cart</a>
    </aside>
  </div>
</main>
<div id="site-footer"></div>
<script type="module" src="/js/customer/order-review.js"></script>
</body>
</html>
