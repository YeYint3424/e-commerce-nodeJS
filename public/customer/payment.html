<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Payment - Shoply</title>
<script>
(function () {
  var stored = localStorage.getItem('theme');
  var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (stored === 'dark' || (!stored && prefersDark)) {
    document.documentElement.classList.add('dark');
  }
})();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
        },
        colors: {
          gold: {
            50: '#fdf8ec',
            100: '#faedc4',
            200: '#f5db8c',
            300: '#edc35a',
            400: '#e0a83e',
            500: '#cc8f2e',
            600: '#b8860b',
            700: '#966b0a',
            800: '#78560c',
            900: '#63470f',
            950: '#392808',
          },
        },
      },
    },
  };
</script>
<link rel="stylesheet" href="/css/animations.css" />
<link rel="stylesheet" href="/css/main.css" />
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased dark:bg-black dark:text-neutral-100">
<div id="site-header"></div>
<main class="mx-auto max-w-3xl px-4 py-10 sm:px-6 lg:px-8">
  <h1 class="anim-fade-up text-2xl font-bold text-slate-900 dark:text-white">Payment</h1>

  <div id="payment-message" class="hidden mt-8 flex-col items-center gap-4 rounded-2xl border border-dashed border-slate-300 py-20 text-center dark:border-neutral-700"></div>

  <div id="payment-content" class="mt-8 space-y-8">
    <section class="rounded-2xl border border-slate-200 bg-white p-6 dark:border-neutral-800 dark:bg-neutral-900">
      <h2 class="text-lg font-bold text-slate-900 dark:text-white">Order Summary</h2>
      <div class="mt-4 space-y-2 text-sm">
        <div class="flex justify-between text-slate-500 dark:text-neutral-400"><span>Order</span><span id="order-id"></span></div>
        <div class="flex justify-between text-slate-500 dark:text-neutral-400"><span>Items</span><span id="order-item-count"></span></div>
        <div class="flex justify-between text-base font-bold text-slate-900 dark:text-white"><span>Total</span><span id="order-total"></span></div>
      </div>
    </section>

    <section id="payment-selection">
      <h2 class="text-lg font-bold text-slate-900 dark:text-white">Choose a Payment Method</h2>
      <div id="payment-options-list" class="mt-4 space-y-3"></div>

      <div id="qr-detail" class="hidden mt-4 rounded-2xl border border-gold-200 bg-gold-50 p-4 dark:border-gold-900 dark:bg-gold-950/40">
        <p class="text-sm font-semibold text-slate-800 dark:text-neutral-100">Account Info</p>
        <p id="qr-account-info" class="mt-1 text-sm text-slate-600 dark:text-neutral-300"></p>
        <div id="qr-image-wrap" class="mt-3"></div>
      </div>

      <button type="button" id="confirm-payment-btn" disabled class="mt-6 w-full rounded-xl bg-gold-600 py-3 text-sm font-semibold text-white hover:bg-gold-500 disabled:cursor-not-allowed disabled:opacity-60">Confirm Payment Method</button>
    </section>

    <section id="proof-upload-section" class="hidden rounded-2xl border border-slate-200 bg-white p-6 dark:border-neutral-800 dark:bg-neutral-900">
      <h2 class="text-lg font-bold text-slate-900 dark:text-white">Upload Payment Proof</h2>
      <p class="mt-1 text-sm text-slate-500 dark:text-neutral-400">Please upload a screenshot of your payment confirmation.</p>
      <input id="proof-file-input" type="file" accept="image/png,image/jpeg,image/webp" class="mt-4 block w-full text-sm text-slate-600 file:mr-4 file:rounded-full file:border-0 file:bg-gold-50 file:px-4 file:py-2 file:text-sm file:font-semibold file:text-gold-700 dark:text-neutral-300 dark:file:bg-gold-950 dark:file:text-gold-300" />
      <div id="proof-preview-wrap" class="hidden mt-4">
        <img id="proof-preview-img" src="" alt="Payment proof preview" class="h-48 w-48 rounded-xl border border-slate-200 object-cover dark:border-neutral-800" />
      </div>
      <button type="button" id="upload-proof-btn" class="mt-4 w-full rounded-xl bg-gold-600 py-3 text-sm font-semibold text-white hover:bg-gold-500 disabled:cursor-not-allowed disabled:opacity-60">Upload Proof</button>
    </section>
  </div>
</main>
<div id="site-footer"></div>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/js/customer/payment.js"></script>
</body>
</html>
